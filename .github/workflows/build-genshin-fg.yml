name: Extract Official Nukem DLL

on:
  push:
    branches:
      - genshin-fg-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - name: Download official OptiScaler v0.9.4 package
        shell: pwsh
        run: |
          $url = 'https://github.com/optiscaler/OptiScaler/releases/download/v0.9.4/Optiscaler_0.9.4-final.20260718._MM.7z'
          Invoke-WebRequest -Uri $url -OutFile optiscaler.7z
          $hash = (Get-FileHash optiscaler.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '575cb4df866116093df75af607e37fd70e10f5163e0f23fd5c804142e80ef0ad') {
            throw "Unexpected OptiScaler package hash: $hash"
          }

      - name: Extract Nukem provider
        shell: pwsh
        run: |
          & 7z x optiscaler.7z -oextracted -y | Out-Null
          $dll = Get-ChildItem -Path extracted -Recurse -Filter dlssg_to_fsr3_amd_is_better.dll -File | Select-Object -First 1
          if (-not $dll) { throw 'dlssg_to_fsr3_amd_is_better.dll not found in official OptiScaler package' }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $dll.FullName package/dlssg_to_fsr3_amd_is_better.dll -Force
          $dllHash = (Get-FileHash package/dlssg_to_fsr3_amd_is_better.dll -Algorithm SHA256).Hash.ToLower()
          "SHA256=$dllHash" | Set-Content package/SHA256.txt -Encoding ascii
          @'
          dlssg_to_fsr3_amd_is_better.dll
          Extracted from the official OptiScaler v0.9.4 GitHub release package.
          That release explicitly bundles Nukem's dlssg_to_fsr3 v0.130.
          '@ | Set-Content package/README.txt -Encoding UTF8
          Compress-Archive -Path package/* -DestinationPath dlssg_to_fsr3_amd_is_better.zip -Force

      - name: Upload DLL ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dlssg_to_fsr3_amd_is_better
          path: dlssg_to_fsr3_amd_is_better.zip
          if-no-files-found: error
