name: Build OptiScaler Nukem Provider

on:
  push:
    branches:
      - genshin-fg-build
  workflow_dispatch:

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone upstream Reforged with submodules
        shell: pwsh
        run: |
          git clone --recursive https://github.com/RespectMathias/dlssg_to_fsr.git src

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: c93f37f1b1d20963ceab60bcd78b946af902ffe9

      - name: Configure
        shell: pwsh
        run: |
          Set-Location src
          cmake --preset test

      - name: Build
        shell: pwsh
        run: |
          Set-Location src
          cmake --build --preset test-release

      - name: Find and package provider DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path src -Recurse -Filter dlssg_to_fsr.dll -File | Select-Object -First 1
          if (-not $dll) { throw 'dlssg_to_fsr.dll not found after build' }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $dll.FullName package/dlssg_to_fsr3_amd_is_better.dll -Force
          $ffx = Get-ChildItem -Path src -Recurse -Filter amd_fidelityfx_dx12.dll -File | Select-Object -First 1
          if ($ffx) { Copy-Item $ffx.FullName package/amd_fidelityfx_dx12.dll -Force }
          @'
          OptiScaler frame-generation provider build.
          Source: RespectMathias/dlssg_to_fsr (continuation of Nukem9/dlssg-to-fsr3)
          The core DLL was renamed to dlssg_to_fsr3_amd_is_better.dll because OptiScaler expects this legacy filename.
          Place the DLL beside OptiScaler's frame-generation runtime DLLs.
          '@ | Set-Content -Encoding UTF8 package/README.txt
          Compress-Archive -Path package/* -DestinationPath dlssg_to_fsr3_OptiScaler.zip -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dlssg_to_fsr3_OptiScaler
          path: dlssg_to_fsr3_OptiScaler.zip
          if-no-files-found: error
