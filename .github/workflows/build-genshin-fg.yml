name: Build Genshin FSR Bridge FG

on:
  push:
    branches:
      - genshin-fg-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone upstream frame-generation branch
        shell: pwsh
        run: |
          git clone --branch frame-generation --single-branch --recurse-submodules https://github.com/AizawaHikaru233/genshin_fsr_brigde.git src

      - name: Build Lite package
        shell: pwsh
        run: |
          Set-Location src
          ./Build-Package.ps1 -Configuration Release

      - name: Upload Lite package
        uses: actions/upload-artifact@v4
        with:
          name: GenshinOneClick-Lite-FG
          path: src/dist/*.zip
          if-no-files-found: error
